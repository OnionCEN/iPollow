<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPollow KZ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&family=Noto+Serif+TC:wght@200..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'Bpmf Huninn', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,102,0,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,102,0,0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 10s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 50px 50px, -50px 50px; }
        }

        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .particle {
            position: absolute; background: #ff6600; border-radius: 50%;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px #ff6600, 0 0 12px #ff4400;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .main-container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 20px;
        }

        .title-wrapper { position: relative; margin-bottom: 2rem; }

        .title {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: clamp(3rem, 10vw, 7rem); font-weight: 400;
            text-transform: uppercase; letter-spacing: 8px; color: #fff;
            text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600, 0 0 40px #ff4400, 0 0 80px #ff2200, 0 0 120px #ff0000;
            animation: titleGlow 2s ease-in-out infinite alternate, titleFloat 3s ease-in-out infinite;
            position: relative; z-index: 2;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600, 0 0 40px #ff4400, 0 0 80px #ff2200; }
            100% { text-shadow: 0 0 20px #ff8800, 0 0 40px #ff6600, 0 0 80px #ff4400, 0 0 120px #ff2200, 0 0 160px #ff0000; }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title-aura {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 200px;
            background: radial-gradient(ellipse, rgba(255,102,0,0.3) 0%, transparent 70%);
            filter: blur(40px);
            animation: auraPulse 2s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes auraPulse {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .decorative-line {
            width: 200px; height: 3px;
            background: linear-gradient(90deg, transparent, #ff6600, #ffaa00, #ff6600, transparent);
            margin: 0 auto 2rem;
            animation: lineShimmer 2s linear infinite;
            border-radius: 2px;
        }

        @keyframes lineShimmer {
            0% { background-position: -200px; }
            100% { background-position: 200px; }
        }

        /* 内容卡片 */
        .content-card {
            max-width: 750px; width: 90%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,102,0,0.4); border-radius: 12px;
            padding: 2.5rem 2rem; text-align: center;
            box-shadow: 0 0 30px rgba(255,102,0,0.2), inset 0 0 30px rgba(255,102,0,0.05);
            animation: cardGlow 3s ease-in-out infinite alternate;
            position: relative; overflow: hidden;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 0 30px rgba(255,102,0,0.2), inset 0 0 30px rgba(255,102,0,0.05); }
            100% { box-shadow: 0 0 50px rgba(255,102,0,0.4), inset 0 0 50px rgba(255,102,0,0.1); }
        }

        .content-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff6600, #ffaa00, #ff6600, #ff4400, #ff6600);
            border-radius: 14px; z-index: -1;
            animation: borderScan 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderScan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content-text {
            font-size: 1.2rem; line-height: 2; color: #e0e0e0;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            position: relative; z-index: 1;
        }

        .highlight {
            color: #ff6600; font-weight: 700;
            text-shadow: 0 0 10px #ff6600;
        }

        /* 比赛卡片网格 */
        .matches-grid {
            display: flex; flex-wrap: wrap; gap: 1.5rem;
            justify-content: center; max-width: 900px; width: 90%;
            margin-top: 1rem;
        }

        .match-card {
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,102,0,0.6); border-radius: 12px;
            padding: 1.5rem; width: 280px; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255,102,0,0.2);
            text-align: center; position: relative; overflow: hidden;
        }

        .match-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 40px rgba(255,102,0,0.5);
            border-color: #ff8800;
        }

        .match-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff6600, #ffaa00, #ff6600);
            border-radius: 14px; z-index: -1;
            animation: borderScan 2s linear infinite;
            background-size: 200% 200%;
            opacity: 0; transition: opacity 0.3s;
        }

        .match-card:hover::before { opacity: 1; }

        .match-name {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: 1.5rem; color: #ff8800;
            text-shadow: 0 0 10px #ff6600;
            margin-bottom: 0.5rem;
        }

        .match-info {
            color: #ccc; font-size: 0.9rem; line-height: 1.6;
        }

        .match-server-on {
            color: #00ff00; text-shadow: 0 0 10px #00ff00; font-weight: 700;
        }

        .match-server-off {
            color: #ff4444; text-shadow: 0 0 10px #ff4444; font-weight: 700;
        }

        .match-click-hint {
            color: #ffaa00; font-size: 0.8rem; margin-top: 0.8rem;
            letter-spacing: 2px; animation: hintPulse 1.5s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            justify-content: center; align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #111; border: 1px solid rgba(255,102,0,0.6);
            border-radius: 16px; padding: 2rem 2.5rem; max-width: 600px; width: 90%;
            box-shadow: 0 0 60px rgba(255,102,0,0.4);
            position: relative; text-align: left; color: #e0e0e0;
        }

        .modal-close {
            position: absolute; top: 1rem; right: 1.2rem;
            font-size: 1.8rem; color: #ff6600; cursor: pointer;
            transition: all 0.3s; background: none; border: none;
            font-family: 'Roboto Condensed', sans-serif;
        }

        .modal-close:hover {
            color: #fff; text-shadow: 0 0 20px #ff6600; transform: scale(1.2);
        }

        .modal-title {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            font-size: 2rem; color: #ff8800;
            text-shadow: 0 0 15px #ff6600;
            margin-bottom: 1.5rem; text-align: center;
        }

        .modal-info { line-height: 2.2; font-size: 1.05rem; }

        .modal-label {
            color: #ff6600; font-weight: 700;
            text-shadow: 0 0 8px #ff6600;
        }

        .divider-fire {
            width: 150px; height: 4px;
            background: linear-gradient(90deg, transparent, #ff4400, #ffaa00, #ff4400, transparent);
            margin: 2.5rem auto; border-radius: 2px;
            animation: fireShimmer 1.5s linear infinite; filter: blur(1px);
        }

        @keyframes fireShimmer {
            0% { background-position: -150px; opacity: 0.7; }
            100% { background-position: 150px; opacity: 1; }
        }

        .contact-section {
            display: flex; flex-wrap: wrap; gap: 1.5rem;
            justify-content: center; align-items: center;
        }

        .contact-title-small {
            width: 100%; text-align: center;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1rem; letter-spacing: 4px; color: #ff8800;
            text-transform: uppercase; margin-bottom: 0.5rem;
        }

        .contact-box {
            background: rgba(20,20,20,0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,102,0,0.5); border-radius: 8px;
            padding: 1rem 1.8rem; display: flex; align-items: center;
            gap: 0.8rem; transition: all 0.3s ease;
            font-size: 1rem; color: #ddd; cursor: default;
            box-shadow: 0 0 15px rgba(255,102,0,0.15);
        }

        .contact-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255,102,0,0.4);
            border-color: #ff8800; background: rgba(30,30,30,0.9);
        }

        .contact-label {
            color: #ff6600; font-weight: 700; letter-spacing: 1px;
        }

        .contact-link {
            color: #ffaa00; text-decoration: none; font-weight: 600;
            transition: color 0.3s;
        }

        .contact-link:hover {
            color: #fff; text-shadow: 0 0 10px #ffaa00;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px);
            z-index: 5; pointer-events: none;
            animation: scanMove 8s linear infinite;
        }

        @keyframes scanMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        footer {
            margin-top: 2rem; color: #555;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.8rem; letter-spacing: 2px; text-align: center;
        }

        @media (max-width: 600px) {
            .content-text { font-size: 1rem; line-height: 1.8; }
            .contact-section { flex-direction: column; gap: 1rem; }
            .contact-box { width: 90%; justify-content: center; }
            .match-card { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="grid-bg"></div>
    <div id="particles"></div>

    <div class="main-container">
        <div class="title-wrapper">
            <div class="title-aura"></div>
            <h1 class="title" id="mainTitle">iPollow KZ</h1>
        </div>

        <div class="decorative-line"></div>

        <!-- 比赛卡片区域（动态生成） -->
        <div class="matches-grid" id="matchesGrid"></div>

        <!-- 默认内容卡片（无比赛时显示） -->
        <div class="content-card" id="defaultContent">
            <p class="content-text" id="mainContent">
                此网站是<span class="highlight">KZ非官方网站</span> iPollow.top<br>
                目前网站正在<span class="highlight">准备举办比赛</span><br>
                且 iPollow.top 目前<span class="highlight">并没有CS1.6服务器</span><br>
                请大家耐心等待
            </p>
        </div>

        <div class="divider-fire"></div>

        <div class="contact-section">
            <div class="contact-title-small" id="contactTitle">⚡ 联系方式 ⚡</div>
            <div class="contact-box">
                <span class="contact-label" id="qqLabel">QQ</span>
                <span>1101547404</span>
            </div>
            <div class="contact-box">
                <span class="contact-label" id="telegramLabel">Telegram</span>
                <a href="https://t.me/ipollowkz" target="_blank" rel="noopener noreferrer" class="contact-link">t.me/ipollowkz</a>
            </div>
        </div>

        <footer id="footerText">© 2026 iPollow KZ</footer>
    </div>

    <!-- 比赛详情弹窗 -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 class="modal-title" id="modalMatchName"></h2>
            <div class="modal-info" id="modalMatchInfo"></div>
        </div>
    </div>

    <script>
        // ==================== 语言包 ====================
        const translations = {
            'zh': {
                title: 'iPollow KZ',
                noMatchContent: '此网站是<span class="highlight">KZ非官方网站</span> iPollow.top<br>目前网站正在<span class="highlight">准备举办比赛</span><br>且 iPollow.top 目前<span class="highlight">并没有CS1.6服务器</span><br>请大家耐心等待',
                contactTitle: '⚡ 联系方式 ⚡',
                qqLabel: 'QQ',
                telegramLabel: 'Telegram',
                footer: '© 2026 iPollow KZ',
                clickToView: '点击查看详情',
                matchName: '比赛名称',
                matchRules: '比赛规则',
                matchOrganizer: '举办者',
                matchMap: '比赛地图',
                matchTime: '比赛时间',
                serverStatus: '服务器状态',
                serverOn: '服务器举行',
                serverOff: '非服务器举行',
                modalClose: '关闭'
            },
            'en': {
                title: 'iPollow KZ',
                noMatchContent: 'This website is the <span class="highlight">unofficial KZ website</span> iPollow.top<br>The website is currently <span class="highlight">preparing to hold a competition</span><br>and iPollow.top currently <span class="highlight">does not have CS1.6 servers</span><br>Please be patient',
                contactTitle: '⚡ Contact Us ⚡',
                qqLabel: 'QQ',
                telegramLabel: 'Telegram',
                footer: '© 2026 iPollow KZ',
                clickToView: 'Click to view details',
                matchName: 'Match Name',
                matchRules: 'Rules',
                matchOrganizer: 'Organizer',
                matchMap: 'Map',
                matchTime: 'Time',
                serverStatus: 'Server Status',
                serverOn: 'On Server',
                serverOff: 'Off Server',
                modalClose: 'Close'
            },
            'ru': {
                title: 'iPollow KZ',
                noMatchContent: 'Этот сайт является <span class="highlight">неофициальным сайтом KZ</span> iPollow.top<br>В настоящее время сайт <span class="highlight">готовится к проведению соревнований</span><br>и iPollow.top в настоящее время <span class="highlight">не имеет серверов CS1.6</span><br>Пожалуйста, подождите',
                contactTitle: '⚡ Контакты ⚡',
                qqLabel: 'QQ',
                telegramLabel: 'Telegram',
                footer: '© 2026 iPollow KZ',
                clickToView: 'Нажмите для просмотра',
                matchName: 'Название матча',
                matchRules: 'Правила',
                matchOrganizer: 'Организатор',
                matchMap: 'Карта',
                matchTime: 'Время',
                serverStatus: 'Статус сервера',
                serverOn: 'На сервере',
                serverOff: 'Не на сервере',
                modalClose: 'Закрыть'
            }
        };

        let currentLang = 'zh';
        let matchesData = [];

        // ==================== 比赛目录检测 ====================
        async function scanMatches() {
            const matchDirs = [];
            
            // 尝试扫描 match 目录下的子目录
            // 注意：这个功能在本地直接打开文件时无法工作，需要部署到服务器上
            // 这里我们通过尝试加载已知目录来检测
            const possibleMatches = ['match1', 'match2', 'match3', 'match4', 'match5', 'match6', 'match7', 'match8', 'match9', 'match10'];
            
            for (const dir of possibleMatches) {
                try {
                    const response = await fetch(`match/${dir}/index.txt`);
                    if (response.ok) {
                        const text = await response.text();
                        const matchData = parseMatchData(text, dir);
                        if (matchData) {
                            matchData.dirName = dir;
                            matchDirs.push(matchData);
                        }
                    }
                } catch (e) {
                    // 目录不存在，跳过
                }
            }
            
            return matchDirs;
        }

        function parseMatchData(text, dirName) {
            const data = {};
            const lines = text.split('\n');
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                
                const eqIndex = trimmed.indexOf('=');
                if (eqIndex === -1) continue;
                
                const key = trimmed.substring(0, eqIndex).trim();
                const value = trimmed.substring(eqIndex + 1).trim();
                
                data[key] = value;
            }

            if (!data['match-name']) return null;

            return {
                name: data['match-name'] || 'Unknown Match',
                rules: data['match-rules'] || 'N/A',
                organizer: data['match-organizer'] || 'N/A',
                map: data['match-map'] || 'N/A',
                server: (data['server'] || '').toUpperCase() === 'ON',
                time: data['match-time'] || 'N/A',
            };
        }

        // ==================== 渲染比赛卡片 ====================
        function renderMatches() {
            const grid = document.getElementById('matchesGrid');
            const defaultContent = document.getElementById('defaultContent');
            const t = translations[currentLang];
            
            grid.innerHTML = '';
            
            if (matchesData.length === 0) {
                defaultContent.style.display = 'block';
                document.getElementById('mainContent').innerHTML = t.noMatchContent;
                return;
            }
            
            defaultContent.style.display = 'none';
            
            matchesData.forEach((match, index) => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatchModal(index);
                
                const serverClass = match.server ? 'match-server-on' : 'match-server-off';
                const serverText = match.server ? t.serverOn : t.serverOff;
                
                card.innerHTML = `
                    <div class="match-name">${escapeHTML(match.name)}</div>
                    <div class="match-info">
                        <div>🗺️ ${escapeHTML(match.map)}</div>
                        <div>👤 ${escapeHTML(match.organizer)}</div>
                        <div class="${serverClass}">🖥️ ${serverText}</div>
                        <div>🕐 ${escapeHTML(match.time)}</div>
                    </div>
                    <div class="match-click-hint">${t.clickToView}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function openMatchModal(index) {
            const match = matchesData[index];
            const t = translations[currentLang];
            
            document.getElementById('modalMatchName').textContent = match.name;
            
            const serverText = match.server ? t.serverOn : t.serverOff;
            const serverColor = match.server ? '#00ff00' : '#ff4444';
            
            document.getElementById('modalMatchInfo').innerHTML = `
                <p><span class="modal-label">${t.matchName}:</span> ${escapeHTML(match.name)}</p>
                <p><span class="modal-label">${t.matchRules}:</span> ${escapeHTML(match.rules)}</p>
                <p><span class="modal-label">${t.matchOrganizer}:</span> ${escapeHTML(match.organizer)}</p>
                <p><span class="modal-label">${t.matchMap}:</span> ${escapeHTML(match.map)}</p>
                <p><span class="modal-label">${t.serverStatus}:</span> <span style="color:${serverColor}; font-weight:700;">${serverText}</span></p>
                <p><span class="modal-label">${t.matchTime}:</span> ${escapeHTML(match.time)}</p>
            `;
            
            document.getElementById('matchModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('matchModal').classList.remove('active');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('matchModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== IP检测与语言切换 ====================
        async function detectIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return { country: data.country_code, countryName: data.country_name, ip: data.ip };
            } catch (error) {
                try {
                    const backupResponse = await fetch('http://ip-api.com/json/');
                    const backupData = await backupResponse.json();
                    return { country: backupData.countryCode, countryName: backupData.country, ip: backupData.query };
                } catch (backupError) {
                    return { country: 'CN', countryName: 'China', ip: 'Unknown' };
                }
            }
        }

        function getLanguage(countryCode) {
            const languageMap = {
                'CN': 'zh', 'HK': 'zh', 'TW': 'zh', 'MO': 'zh', 'SG': 'zh',
                'US': 'en', 'GB': 'en', 'CA': 'en', 'AU': 'en', 'NZ': 'en', 'IE': 'en',
                'RU': 'ru', 'BY': 'ru', 'KZ': 'ru',
                'IL': 'block'
            };
            return languageMap[countryCode] || 'en';
        }

        function updatePageContent(lang) {
            currentLang = lang;
            const t = translations[lang];
            if (!t) return;

            document.getElementById('mainTitle').textContent = t.title;
            document.getElementById('mainContent').innerHTML = t.noMatchContent;
            document.getElementById('contactTitle').textContent = t.contactTitle;
            document.getElementById('qqLabel').textContent = t.qqLabel;
            document.getElementById('telegramLabel').textContent = t.telegramLabel;
            document.getElementById('footerText').textContent = t.footer;
            
            renderMatches();
        }

        function blockAccess() {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;color:#ff0000;font-family:'ZCOOL QingKe HuangYou',sans-serif;text-align:center;flex-direction:column;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;">
                    <h1 style="font-size:5rem;text-shadow:0 0 30px #ff0000;animation:pulse 1s infinite;">🚫 ACCESS DENIED</h1>
                    <p style="font-size:1.5rem;margin-top:20px;color:#ff4444;">You are not allowed to access this website.</p>
                    <p style="font-size:1rem;color:#888;margin-top:10px;">הגישה לאתר זה אינה מורשית מאזורך</p>
                    <style>@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}</style>
                </div>
            `;
            document.body.style.overflow = 'hidden';
        }

        // ==================== 粒子效果 ====================
        function initParticles() {
            const particlesContainer = document.getElementById('particles');
            
            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 2;
                const posX = Math.random() * 100;
                const duration = Math.random() * 5 + 4;
                const delay = Math.random() * 3;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = posX + '%';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                
                particlesContainer.appendChild(particle);
                setTimeout(() => particle.remove(), (duration + delay) * 1000);
            }

            for (let i = 0; i < 30; i++) setTimeout(createParticle, i * 200);
            setInterval(createParticle, 400);

            document.addEventListener('click', function(e) {
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    const size = Math.random() * 5 + 2;
                    const duration = Math.random() * 2 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = (e.clientX / window.innerWidth * 100) + '%';
                    particle.style.top = (e.clientY / window.innerHeight * 100) + '%';
                    particle.style.animationDuration = duration + 's';
                    particle.style.animation = `floatUpClick ${duration}s linear forwards`;
                    particlesContainer.appendChild(particle);
                    setTimeout(() => particle.remove(), duration * 1000);
                }
            });

            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatUpClick {
                    0% { transform: translate(0, 0) scale(0); opacity: 0; }
                    20% { opacity: 1; }
                    100% { transform: translate(${Math.random() * 100 - 50}px, -150px) scale(1.5); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }

        // ==================== 主初始化 ====================
        async function init() {
            initParticles();
            
            const ipData = await detectIP();
            console.log('IP:', ipData);
            
            const language = getLanguage(ipData.country);
            
            if (language === 'block') {
                blockAccess();
                return;
            }
            
            currentLang = language;
            updatePageContent(language);
            
            // 扫描比赛
            matchesData = await scanMatches();
            renderMatches();
            
            console.log(`语言: ${language}, 检测到 ${matchesData.length} 个比赛`);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
